<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge AI — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--surface:#131315;--surface2:#1a1a1d;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--text:#f0f0f2;--muted:#6b6b78;--muted2:#9090a0;--accent:#ff6b35;--accent2:#ff8c5a;--green:#22c97a;--red:#ff3b3b;--font:'Syne',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,107,53,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,107,53,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:2.5rem;width:100%;max-width:420px;position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff}
.logo-text{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.5rem}
.subtitle{font-size:.85rem;color:var(--muted2);margin-bottom:2rem;line-height:1.6}
.field{margin-bottom:1.25rem}
label{display:block;font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:11px 14px;color:var(--text);font-family:var(--mono);font-size:.82rem;outline:none;transition:border-color .2s}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
.btn{width:100%;padding:12px;border-radius:8px;border:none;cursor:pointer;font-family:var(--font);font-size:.9rem;font-weight:700;background:var(--accent);color:#fff;transition:all .2s;margin-top:.5rem}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.msg{border-radius:8px;padding:.875rem 1rem;font-size:.82rem;margin-bottom:1rem;line-height:1.5;display:none}
.msg.on{display:block}
.msg.err{background:rgba(255,59,59,.08);border:1px solid rgba(255,59,59,.2);color:#ff8080}
.msg.ok{background:rgba(34,201,122,.08);border:1px solid rgba(34,201,122,.2);color:var(--green)}
.msg.info{background:rgba(77,159,255,.08);border:1px solid rgba(77,159,255,.2);color:#7db8ff}
.link-row{text-align:center;font-size:.82rem;color:var(--muted2);margin-top:1.25rem}
.link-row a{color:var(--accent);text-decoration:none;font-weight:600}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.debug{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.75rem;font-family:var(--mono);font-size:.68rem;color:var(--muted2);margin-top:1rem;display:none;word-break:break-all;line-height:1.8;white-space:pre-wrap}
.debug.on{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">F</div>
    <div class="logo-text">Forge AI</div>
  </div>

  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to your Forge AI account to continue.</p>

  <div class="msg info on" id="status">⟳ Connecting to Forge AI...</div>
  <div class="msg err" id="error"></div>
  <div class="msg ok" id="success"></div>
  <div class="debug" id="debug"></div>

  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@youragency.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
  </div>

  <button class="btn" id="btn" onclick="login()" disabled>Connecting...</button>

  <div class="link-row">Don't have an account? <a href="forge-ai-signup.html">Create one free</a></div>
</div>

<script>
const SUPA_URL = 'https://mybvzjcjfjytcfgitmpv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15YnZ6amNqZmp5dGNmZ2l0bXB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTE5MjgsImV4cCI6MjA5NDE4NzkyOH0.OHKGmKlyk86kdSXjFh5jVHqvMC-nPKhPkAtSraPVwEs';
let sb = null;

function log(msg) {
  const el = document.getElementById('debug');
  el.textContent += msg + '\n';
  el.classList.add('on');
}

function showErr(msg) {
  document.getElementById('status').classList.remove('on');
  document.getElementById('success').classList.remove('on');
  const el = document.getElementById('error');
  el.textContent = '⚠ ' + msg;
  el.classList.add('on');
}

function showOk(msg) {
  document.getElementById('status').classList.remove('on');
  document.getElementById('error').classList.remove('on');
  const el = document.getElementById('success');
  el.textContent = '✓ ' + msg;
  el.classList.add('on');
}

window.onload = async () => {
  log('Loading Supabase library...');
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
  script.onload = async () => {
    log('Library loaded. Connecting...');
    try {
      sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
      const { data } = await sb.auth.getSession();
      if (data?.session) {
        log('Already logged in. Redirecting...');
        window.location.href = 'forge-ai-dashboard.html';
        return;
      }
      log('Connected. Ready to sign in.');
      document.getElementById('status').classList.remove('on');
      document.getElementById('btn').disabled = false;
      document.getElementById('btn').textContent = 'Sign In →';
    } catch(e) {
      log('Error: ' + e.message);
      showErr('Could not connect. Check your internet and refresh.');
      document.getElementById('btn').textContent = 'Connection Failed';
    }
  };
  script.onerror = () => {
    log('Failed to load library');
    showErr('Could not load required files. Check your internet connection.');
  };
  document.head.appendChild(script);
};

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn');

  if (!email) { showErr('Please enter your email.'); return; }
  if (!password) { showErr('Please enter your password.'); return; }
  if (!sb) { showErr('Not connected. Please refresh.'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in...';
  log('Signing in as: ' + email);

  try {
    const { data, error } = await sb.auth.signInWithPassword({
      email: email,
      password: password
    });

    log('Response: ' + JSON.stringify({ user: data?.user?.email, error: error?.message }));

    if (error) throw error;

    log('Success! Redirecting to dashboard...');
    showOk('Signed in! Loading your dashboard...');
    setTimeout(() => window.location.href = 'forge-ai-dashboard.html', 1000);

  } catch(err) {
    log('Error: ' + err.message);
    showErr(err.message || 'Invalid email or password. Please try again.');
    btn.disabled = false;
    btn.innerHTML = 'Sign In →';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !document.getElementById('btn').disabled) login();
});
</script>
</body>
</html>
