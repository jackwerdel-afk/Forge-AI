<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Health Report</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--surface:#111117;--surface2:#17171f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f0f5;--text2:#a0a0b0;--muted:#70708a;--muted2:#50506a;
  --accent:#FF883F;--green:#22c97a;--yellow:#f5a623;--red:#ff4d4d;--blue:#4d9fff;
  --font:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}

/* Loading */
#loading{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
.loading-icon{font-size:32px;animation:spin 2s linear infinite;color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--muted)}

/* Error */
#error-screen{display:none;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;padding:24px;text-align:center}
.error-icon{font-size:40px;margin-bottom:8px}
.error-title{font-size:18px;font-weight:700}
.error-text{font-size:14px;color:var(--muted2);max-width:400px;line-height:1.6}

/* App */
#app{display:none;min-height:100vh}

/* Header */
.client-header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:18px 24px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
  backdrop-filter:blur(10px);
}
.client-brand{display:flex;align-items:center;gap:10px}
.client-brand-icon{font-size:20px;color:var(--accent)}
.client-brand-name{font-size:14px;font-weight:700;letter-spacing:0.02em;color:var(--text)}
.client-brand-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.client-scan-time{font-size:11px;color:var(--muted2);font-family:var(--mono)}

/* Main */
.client-main{max-width:860px;margin:0 auto;padding:32px 24px}

/* Site intro */
.site-intro{margin-bottom:32px}
.site-name{font-size:28px;font-weight:900;letter-spacing:-0.03em;margin-bottom:6px}
.site-url{font-size:13px;color:var(--muted);font-family:var(--mono)}

/* Score hero */
.score-hero{
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:16px;
  padding:28px 32px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:28px;
  align-items:center;
  margin-bottom:24px;
}
.score-circle{
  width:100px;height:100px;
  border-radius:50%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border:3px solid;
  flex-shrink:0;
}
.score-circle.high{border-color:var(--green);background:rgba(34,201,122,0.06)}
.score-circle.mid{border-color:var(--yellow);background:rgba(245,166,35,0.06)}
.score-circle.low{border-color:var(--red);background:rgba(255,77,77,0.06)}
.score-num{font-size:36px;font-weight:900;line-height:1;letter-spacing:-0.04em}
.score-num.high{color:var(--green)}
.score-num.mid{color:var(--yellow)}
.score-num.low{color:var(--red)}
.score-label{font-size:9px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px}
.score-meta{flex:1}
.score-status{font-size:20px;font-weight:800;margin-bottom:6px;letter-spacing:-0.02em}
.score-desc{font-size:13px;color:var(--text2);line-height:1.6;max-width:400px}
.score-grade{
  font-size:42px;font-weight:900;
  width:70px;height:70px;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.score-grade.A{background:rgba(34,201,122,.1);color:var(--green)}
.score-grade.B{background:rgba(77,159,255,.1);color:var(--blue)}
.score-grade.C{background:rgba(245,166,35,.1);color:var(--yellow)}
.score-grade.D,.score-grade.F{background:rgba(255,77,77,.1);color:var(--red)}

/* Modules */
.section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:14px;font-family:var(--mono)}
.modules-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
@media(max-width:600px){.modules-grid{grid-template-columns:repeat(2,1fr)}.score-hero{grid-template-columns:1fr;text-align:center}.score-circle{margin:0 auto}}
.module-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px 14px;text-align:center;
}
.module-score{font-size:24px;font-weight:800;line-height:1;margin-bottom:4px}
.module-score.high{color:var(--green)}
.module-score.mid{color:var(--yellow)}
.module-score.low{color:var(--red)}
.module-name{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-family:var(--mono)}
.module-bar{height:3px;background:var(--border2);border-radius:2px;margin-top:8px;overflow:hidden}
.module-bar-fill{height:100%;border-radius:2px;transition:width 0.8s ease}

/* Issues */
.issues-section{margin-bottom:24px}
.issue-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 16px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;margin-bottom:8px;
}
.issue-severity{
  font-size:9px;font-weight:700;padding:3px 7px;border-radius:3px;
  text-transform:uppercase;letter-spacing:0.06em;flex-shrink:0;margin-top:1px;
  font-family:var(--mono);
}
.issue-severity.critical{background:rgba(255,77,77,.12);color:var(--red)}
.issue-severity.high{background:rgba(245,166,35,.12);color:var(--yellow)}
.issue-severity.medium{background:rgba(77,159,255,.12);color:var(--blue)}
.issue-severity.low{background:rgba(144,144,160,.12);color:var(--muted)}
.issue-text{font-size:13px;color:var(--text2);line-height:1.5}
.issue-module{font-size:10px;color:var(--muted2);margin-top:2px;font-family:var(--mono)}

/* History */
.history-section{margin-bottom:32px}
.history-chart{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:20px;
  display:flex;align-items:flex-end;gap:8px;height:100px;
}
.history-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.history-bar{width:100%;border-radius:4px 4px 0 0;transition:height 0.5s ease;min-height:4px}
.history-bar.high{background:var(--green)}
.history-bar.mid{background:var(--yellow)}
.history-bar.low{background:var(--red)}
.history-score{font-size:9px;color:var(--muted);font-family:var(--mono)}

/* Footer */
.client-footer{
  text-align:center;padding:32px 24px;
  border-top:1px solid var(--border);
  color:var(--muted2);font-size:12px;
}
.client-footer a{color:var(--muted);text-decoration:none}
.powered-by{font-family:var(--mono);letter-spacing:0.05em}

/* No data */
.no-scan{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:40px;text-align:center;
  color:var(--muted2);
}
</style>
</head>
<body>

<div id="loading">
  <div class="loading-icon">⬡</div>
  <div class="loading-text">Loading your site report...</div>
</div>

<div id="error-screen">
  <div class="error-icon">⚠️</div>
  <div class="error-title">Report not found</div>
  <div class="error-text">This link may have expired or is invalid. Contact your agency for a new link.</div>
</div>

<div id="app">
  <header class="client-header">
    <div class="client-brand">
      <span class="client-brand-icon">⬡</span>
      <div>
        <div class="client-brand-name" id="agency-name">Forge AI</div>
        <div class="client-brand-sub">Website Health Report</div>
      </div>
    </div>
    <div class="client-scan-time" id="scan-time"></div>
  </header>

  <main class="client-main">
    <div class="site-intro">
      <div class="site-name" id="site-name">—</div>
      <div class="site-url" id="site-url">—</div>
    </div>

    <!-- Score Hero -->
    <div class="score-hero" id="score-hero">
      <div class="score-circle" id="score-circle">
        <div class="score-num" id="score-num">—</div>
        <div class="score-label">/ 100</div>
      </div>
      <div class="score-meta">
        <div class="score-status" id="score-status">—</div>
        <div class="score-desc" id="score-desc">—</div>
      </div>
      <div class="score-grade" id="score-grade">—</div>
    </div>

    <!-- Module Scores -->
    <div class="section-title">Score Breakdown</div>
    <div class="modules-grid" id="modules-grid"></div>

    <!-- Score History -->
    <div class="history-section" id="history-section" style="display:none">
      <div class="section-title">Score History</div>
      <div class="history-chart" id="history-chart"></div>
    </div>

    <!-- Issues -->
    <div class="issues-section" id="issues-section">
      <div class="section-title">Issues Found</div>
      <div id="issues-list"></div>
    </div>
  </main>

  <footer class="client-footer">
    <div class="powered-by">Powered by Forge AI &nbsp;·&nbsp; <a href="https://forgeai-wgs.com" target="_blank">forgeai-wgs.com</a></div>
  </footer>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');

  if (!token) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
    return;
  }

  function scoreClass(s) { return s >= 80 ? 'high' : s >= 60 ? 'mid' : 'low'; }
  function scoreStatus(s) {
    if (s >= 90) return 'Excellent';
    if (s >= 80) return 'Good';
    if (s >= 70) return 'Needs Attention';
    if (s >= 60) return 'Poor';
    return 'Critical';
  }
  function scoreDesc(s) {
    if (s >= 90) return 'Your site is performing at a high level across all areas.';
    if (s >= 80) return 'Your site is in good shape with a few areas to improve.';
    if (s >= 70) return 'Your site has some issues that should be addressed soon.';
    if (s >= 60) return 'Your site has significant issues affecting performance and visibility.';
    return 'Your site has critical issues that need immediate attention.';
  }
  function gradeClass(g) { return g ? g.charAt(0) : 'C'; }

  fetch('/api/client-portal?token=' + encodeURIComponent(token))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('loading').style.display = 'none';

      if (!data.success || !data.portal) {
        document.getElementById('error-screen').style.display = 'flex';
        return;
      }

      var p = data.portal;
      document.getElementById('app').style.display = 'block';
      document.title = (p.siteName || p.siteUrl) + ' — Site Health Report';

      // Header
      document.getElementById('agency-name').textContent = p.agencyName || 'Forge AI';
      if (p.lastScan) {
        var d = new Date(p.lastScan);
        document.getElementById('scan-time').textContent = 'Last scanned: ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      // Site info
      document.getElementById('site-name').textContent = p.siteName || p.siteUrl;
      document.getElementById('site-url').textContent = p.siteUrl;

      // Score
      var score = p.score;
      if (score !== null && score !== undefined) {
        var cls = scoreClass(score);
        var circle = document.getElementById('score-circle');
        circle.classList.add(cls);
        var num = document.getElementById('score-num');
        num.textContent = score;
        num.classList.add(cls);
        document.getElementById('score-status').textContent = scoreStatus(score);
        document.getElementById('score-desc').textContent = scoreDesc(score);
        var grade = document.getElementById('score-grade');
        var g = p.grade || (score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : score >= 60 ? 'D' : 'F');
        grade.textContent = g;
        grade.classList.add(gradeClass(g));
      } else {
        document.getElementById('score-status').textContent = 'Not yet scanned';
        document.getElementById('score-desc').textContent = 'This site has not been scanned yet. Check back soon.';
        document.getElementById('score-num').textContent = '—';
        document.getElementById('score-grade').textContent = '—';
      }

      // Modules
      var modulesGrid = document.getElementById('modules-grid');
      var moduleNames = { seo: 'SEO', performance: 'Performance', mobile: 'Mobile', ux: 'UX', maintenance: 'Maintenance' };
      if (p.lastResult && p.lastResult.modules) {
        Object.entries(p.lastResult.modules).forEach(function(entry) {
          var key = entry[0], mod = entry[1];
          if (!mod) return;
          var modScore = mod.score !== undefined ? mod.score : null;
          var cls = modScore !== null ? scoreClass(modScore) : 'mid';
          var fillColor = cls === 'high' ? 'var(--green)' : cls === 'mid' ? 'var(--yellow)' : 'var(--red)';
          var pct = modScore !== null ? (modScore / 20 * 100) : 0;
          var card = document.createElement('div');
          card.className = 'module-card';
          card.innerHTML = '<div class="module-score ' + cls + '">' + (modScore !== null ? modScore : '—') + '</div>' +
            '<div class="module-name">' + (moduleNames[key] || key) + '</div>' +
            '<div class="module-bar"><div class="module-bar-fill" style="width:' + pct + '%;background:' + fillColor + '"></div></div>';
          modulesGrid.appendChild(card);
        });
      } else {
        modulesGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted2);font-size:13px;padding:20px">No module data available</div>';
      }

      // Score history
      if (p.scoreHistory && p.scoreHistory.length > 1) {
        document.getElementById('history-section').style.display = 'block';
        var chart = document.getElementById('history-chart');
        var history = p.scoreHistory.slice(-8);
        var maxScore = 100;
        history.forEach(function(h) {
          var s = h.score || h;
          var pct = (s / maxScore) * 100;
          var cls = scoreClass(s);
          var wrap = document.createElement('div');
          wrap.className = 'history-bar-wrap';
          wrap.innerHTML = '<div class="history-bar ' + cls + '" style="height:' + pct + '%"></div>' +
            '<div class="history-score">' + s + '</div>';
          chart.appendChild(wrap);
        });
      }

      // Issues
      var issuesList = document.getElementById('issues-list');
      var allIssues = [];
      if (p.lastResult && p.lastResult.modules) {
        Object.entries(p.lastResult.modules).forEach(function(entry) {
          var key = entry[0], mod = entry[1];
          if (mod && mod.deductions) {
            mod.deductions.forEach(function(d) {
              allIssues.push({ module: key, issue: d.issue, severity: (d.severity || 'medium').toLowerCase() });
            });
          }
        });
      }

      // Sort by severity
      var sevOrder = { critical: 0, high: 1, medium: 2, low: 3 };
      allIssues.sort(function(a, b) { return (sevOrder[a.severity] || 2) - (sevOrder[b.severity] || 2); });

      if (allIssues.length === 0) {
        issuesList.innerHTML = '<div class="no-scan"><div style="font-size:32px;margin-bottom:12px">✓</div><div style="font-size:15px;font-weight:700;margin-bottom:6px">No issues found</div><div style="font-size:13px;color:var(--muted2)">Your site is in great shape.</div></div>';
      } else {
        var moduleNames2 = { seo: 'SEO', performance: 'Performance', mobile: 'Mobile', ux: 'UX', maintenance: 'Maintenance' };
        // Show top 10 issues max
        allIssues.slice(0, 10).forEach(function(issue) {
          var item = document.createElement('div');
          item.className = 'issue-item';
          item.innerHTML = '<span class="issue-severity ' + issue.severity + '">' + issue.severity + '</span>' +
            '<div><div class="issue-text">' + issue.issue + '</div>' +
            '<div class="issue-module">' + (moduleNames2[issue.module] || issue.module) + '</div></div>';
          issuesList.appendChild(item);
        });
        if (allIssues.length > 10) {
          var more = document.createElement('div');
          more.style.cssText = 'text-align:center;padding:12px;font-size:12px;color:var(--muted2)';
          more.textContent = '+ ' + (allIssues.length - 10) + ' more issues';
          issuesList.appendChild(more);
        }
      }
    })
    .catch(function(e) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-screen').style.display = 'flex';
      console.error('Client portal error:', e);
    });
})();
</script>
</body>
</html>
