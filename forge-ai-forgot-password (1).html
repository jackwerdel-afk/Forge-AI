<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge AI — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg: #09090f; --surface: #111117; --surface2: #17171f;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #f0f0f5; --text2: #a0a0b0; --muted: #606070;
  --muted2: #9090a8;
  --accent: #FF883F; --accent2: #ff6b20;
  --green: #22c97a; --red: #ff4d4d;
  --yellow: #f5a623;
  --blue: #4d9fff;
  --font: 'Inter', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; -webkit-font-smoothing: antialiased; }
.container { width: 100%; max-width: 420px; }
.logo { display: flex; align-items: center; justify-content: center; margin-bottom: 36px; }
.logo img { height: 52px; width: auto; object-fit: contain; mix-blend-mode: screen; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px; }
.card-title { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; text-align: center; }
.card-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 28px; line-height: 1.6; }
.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; }
.form-input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 9px; padding: 11px 14px; color: var(--text); font-family: var(--font); font-size: 13.5px; outline: none; transition: border-color 0.15s; }
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--muted); }
.btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 9px; padding: 12px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary:hover { background: var(--accent2); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.error-msg { background: rgba(255,77,77,.08); border: 1px solid rgba(255,77,77,.2); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; color: var(--red); margin-bottom: 14px; display: none; }
.success-screen { display: none; text-align: center; }
.success-icon { width: 64px; height: 64px; background: rgba(34,201,122,.1); border: 1px solid rgba(34,201,122,.2); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 20px; }
.success-title { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px; }
.success-sub { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
.link-row { text-align: center; font-size: 13px; color: var(--muted); margin-top: 20px; }
.link-row a { color: var(--accent); text-decoration: none; font-weight: 500; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
</style>
</head>
<body>

<div class="container">

  <div class="logo">
    <img src="Powered by Werdel Global Systems.png" alt="Forge AI">
  </div>

  <div class="card">

    <!-- Reset form -->
    <div id="reset-form">
      <div class="card-title">Reset your password</div>
      <div class="card-sub">Enter your email and we'll send you a link to reset your password.</div>

      <div id="error-msg" class="error-msg"></div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@agency.com" onkeydown="if(event.key==='Enter')handleReset()">
      </div>

      <button class="btn-primary" id="reset-btn" onclick="handleReset()">
        Send Reset Link →
      </button>
    </div>

    <!-- Success screen -->
    <div class="success-screen" id="success-screen">
      <div class="success-icon">✉️</div>
      <div class="success-title">Check your email</div>
      <div class="success-sub">
        We sent a password reset link to<br>
        <strong id="sent-email" style="color:var(--text)">—</strong><br><br>
        Click the link in the email to set a new password. Check your spam folder if you don't see it.
      </div>
      <a href="forge-ai-login.html" class="btn-primary" style="text-decoration:none">
        Back to Sign In
      </a>
    </div>

  </div>

  <div class="link-row">
    <a href="forge-ai-login.html">← Back to Sign In</a>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://mybvzjcjfjytcfgitmpv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15YnZ6amNqZmp5dGNmZ2l0bXB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTE5MjgsImV4cCI6MjA5NDE4NzkyOH0.OHKGmKlyk86kdSXjFh5jVHqvMC-nPKhPkAtSraPVwEs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

async function handleReset() {
  const email = document.getElementById('email').value.trim();
  const errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';

  if (!email || !email.includes('@')) {
    errEl.textContent = 'Please enter a valid email address.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('reset-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Sending...';

  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://forgeai-wgs.com/forge-ai-reset-password.html'
    });

    if (error) throw error;

    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('sent-email').textContent = email;
    document.getElementById('success-screen').style.display = 'block';

  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = 'Send Reset Link →';
    errEl.textContent = e.message || 'Something went wrong. Please try again.';
    errEl.style.display = 'block';
  }
}
</script>
</body>
</html>
