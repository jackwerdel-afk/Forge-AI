<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge AI — White Label Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg: #09090f; --sidebar: #111117; --surface: #111117; --surface2: #17171f;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #f0f0f5; --text2: #a0a0b0; --muted: #606070; --muted2: #9090a8;
  --accent: #FF883F; --accent2: #ff6b20;
  --green: #22c97a; --red: #ff4d4d; --yellow: #f5a623; --blue: #4d9fff;
  --font: 'Inter', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --sidebar-width: 220px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; font-size: 14px; -webkit-font-smoothing: antialiased; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

/* ── LAYOUT ── */
.layout { display: flex; min-height: 100vh; }

/* ── SIDEBAR ── */
.sidebar { width: var(--sidebar-width); background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; overflow-y: auto; }
.sidebar-logo { display: flex; align-items: center; justify-content: center; padding: 22px 18px 18px; border-bottom: 1px solid var(--border); text-decoration: none; }
.sidebar-nav { flex: 1; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; color: var(--muted2); text-decoration: none; font-size: 13px; font-weight: 500; transition: all 0.15s; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: rgba(255,136,63,0.1); color: var(--accent); font-weight: 600; }
.nav-item-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
.sidebar-bottom { padding: 10px 10px 14px; border-top: 1px solid var(--border); }
.agency-info { padding: 8px 12px; margin-bottom: 4px; }
.agency-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
.agency-name-text { font-size: 13px; font-weight: 600; color: var(--text2); }
.plan-badge { display: inline-flex; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; font-family: var(--mono); margin-top: 4px; }
.plan-badge.free { background: rgba(107,107,120,.15); color: var(--muted2); }
.plan-badge.starter { background: rgba(77,159,255,.12); color: var(--blue); }
.plan-badge.agency { background: rgba(34,201,122,.12); color: var(--green); }
.plan-badge.enterprise { background: rgba(255,107,53,.12); color: var(--accent); }

/* ── MAIN ── */
.main { margin-left: var(--sidebar-width); flex: 1; padding: 36px 40px; }
.page-header { margin-bottom: 28px; }
.page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.04em; margin-bottom: 5px; }
.page-sub { font-size: 13px; color: var(--muted2); }

/* ── GRID ── */
.report-grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }

/* ── CARDS ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 14px; }
.card-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 18px; }

/* ── FORM ── */
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--text2); display: block; margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 9px 12px; color: var(--text); font-family: var(--font); font-size: 13px; outline: none; transition: border-color 0.15s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); }
.field textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.field select { cursor: pointer; }

/* ── COLOR ROW ── */
.color-row { display: flex; gap: 8px; align-items: center; }
.color-row input[type="color"] { width: 42px; height: 38px; border: 1px solid var(--border2); border-radius: 8px; background: var(--surface2); cursor: pointer; padding: 3px; }

/* ── BUTTONS ── */
.btn-row { display: flex; gap: 8px; margin-top: 4px; }
.btn-primary { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
.btn-primary:hover { background: var(--accent2); }
.btn-ghost { background: var(--surface2); border: 1px solid var(--border2); color: var(--text2); padding: 10px 18px; border-radius: 8px; font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.btn-ghost:hover { border-color: var(--text); color: var(--text); }

/* ── PREVIEW PANEL ── */
.preview-wrap { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 32px rgba(0,0,0,0.4); position: sticky; top: 24px; }
.preview-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.preview-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.preview-badge { font-size: 10px; background: rgba(34,201,122,.1); color: var(--green); padding: 2px 8px; border-radius: 20px; font-weight: 600; }
.preview-body { max-height: calc(100vh - 180px); overflow-y: auto; }
.preview-body::-webkit-scrollbar { width: 4px; }
.preview-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }
</style>
</head>
<body>

<div id="auth-check" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="text-align:center">
    <div style="width:36px;height:36px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px"></div>
    <div style="font-size:13px;color:var(--muted)">Loading...</div>
  </div>
</div>

<div id="app" style="display:none">
<div class="layout">

  <!-- SIDEBAR -->
          <aside class="sidebar">
      <a href="forge-ai-dashboard.html" class="sidebar-logo">
        <img src="Powered by Werdel Global Systems.png" alt="Forge AI" style="height:80px;width:auto;object-fit:contain;mix-blend-mode:screen;" onerror="this.style.display='none'">
      </a>
      <nav class="sidebar-nav">
      <a class="nav-item" href="forge-ai-dashboard.html"><span class="nav-item-icon">⚡</span> Dashboard</a>
      <a class="nav-item active" href="forge-ai-report.html"><span class="nav-item-icon">📄</span> Reports</a>
      <a class="nav-item" id="alerts-nav" href="forge-ai-dashboard.html#alerts"><span class="nav-item-icon">🔔</span> Alerts</a>
      <a class="nav-item" id="connections-nav" style="display:none" href="forge-ai-dashboard.html#connections"><span class="nav-item-icon">🔗</span> Connections</a>
      <a class="nav-item" id="team-nav" style="display:none" href="forge-ai-team.html"><span class="nav-item-icon">👥</span> Team</a>
      <a class="nav-item" id="billing-nav" href="forge-ai-billing.html"><span class="nav-item-icon">💳</span> Billing</a>
      <a class="nav-item" id="settings-nav" href="forge-ai-settings.html"><span class="nav-item-icon">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-bottom">
        <div style="padding:12px 10px">
          <div style="font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Agency</div>
          <div style="font-size:13px;font-weight:600;color:var(--text)" id="sb-agency-name">—</div>
          <div style="display:inline-block;margin-top:4px;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700;background:rgba(107,107,120,0.15);color:#70708a" id="sb-plan-badge">Free</div>
        </div>
        <button class="nav-item" onclick="doSignOut()" style="color:var(--muted2);width:100%;text-align:left;background:none;border:none;cursor:pointer;font-family:inherit">
          <span class="nav-item-icon">→</span> Sign out
        </button>
      </div>
    </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="page-header">
      <div class="page-title">White Label Reports</div>
      <div class="page-sub">Create branded client reports with your agency's name and colors — clients never see Forge AI.</div>
    </div>

    <div class="report-grid">

      <!-- LEFT: SETTINGS -->
      <div>
        <div class="card">
          <div class="card-title">Agency Branding</div>
          <div class="field">
            <label>Agency Name</label>
            <input type="text" id="agency-name" placeholder="Your Agency Name" oninput="updatePreview()">
          </div>
          <div class="field">
            <label>Tagline <span style="color:var(--muted);font-weight:400">(optional)</span></label>
            <input type="text" id="agency-tagline" placeholder="Web Design & Digital Marketing" oninput="updatePreview()">
          </div>
          <div class="field">
            <label>Brand Color</label>
            <div class="color-row">
              <input type="color" id="brand-color" value="#FF883F" oninput="syncColorFromPicker()">
              <input type="text" id="brand-color-hex" value="#FF883F" placeholder="#FF883F" oninput="syncColorFromHex()" style="flex:1;font-family:var(--mono);font-size:12px">
            </div>
          </div>
          <div class="field">
            <label>Client Name</label>
            <input type="text" id="client-name" placeholder="Client Company Name" oninput="updatePreview()">
          </div>
        </div>

        <div class="card">
          <div class="card-title">Report Data</div>
          <div class="field">
            <label>Load from scan</label>
            <select id="scan-select" onchange="loadScan()">
              <option value="">Select a site scan...</option>
            </select>
          </div>
          <div class="field">
            <label>Website URL</label>
            <input type="text" id="report-url" placeholder="https://clientsite.com" oninput="updatePreview()">
          </div>
          <div class="field">
            <label>Overall Score</label>
            <input type="number" id="report-score" min="0" max="100" value="72" oninput="updatePreview()">
          </div>
          <div class="field">
            <label>Executive Summary</label>
            <textarea id="report-summary" placeholder="Brief summary of findings and recommendations..." oninput="updatePreview()"></textarea>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn-primary" onclick="downloadReport()">⬇ Download Report</button>
          <button class="btn-ghost" onclick="updatePreview()">↻ Refresh Preview</button>
        </div>
      </div>

      <!-- RIGHT: LIVE PREVIEW -->
      <div>
        <div class="preview-wrap">
          <div class="preview-header">
            <span class="preview-label">Live Preview</span>
            <span class="preview-badge">● Live</span>
          </div>
          <div class="preview-body">
            <div id="report-preview" style="padding:0"></div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>
</div>

<script>
const SUPA_URL = 'https://mybvzjcjfjytcfgitmpv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15YnZ6amNqZmp5dGNmZ2l0bXB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTE5MjgsImV4cCI6MjA5NDE4NzkyOH0.OHKGmKlyk86kdSXjFh5jVHqvMC-nPKhPkAtSraPVwEs';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let currentScanData = null;
let USER = null;

async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'forge-ai-login.html'; return; }
    USER = session.user;
    var __role = await applyNavRole(sb, USER.id, USER.email);
    var __an = document.getElementById('sb-agency-name'); if(__an) __an.textContent = USER.user_metadata?.agency_name || USER.email.split('@')[0];
    const pageRoleInfo = await window.sbApplyRole(USER.id, USER.email);
    window.sbSetAgencyName(USER.user_metadata?.agency_name);
    

    document.getElementById('auth-check').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    // Set sidebar agency name
    const agencyName = USER.user_metadata?.agency_name || 'Your Agency';
    var sag = document.getElementById('sidebar-agency'); if(sag) sag.textContent = agencyName;

    // Load plan badge
    try {
      const { data: sub } = await sb.from('subscriptions').select('plan').eq('user_id', USER.id).maybeSingle();
      const plan = sub?.plan || 'free';
      const badge = document.getElementById('plan-badge');
      const names = { free:'Free', starter:'Starter', agency:'Agency', enterprise:'Enterprise' };
      badge.textContent = names[plan] || 'Free';
      badge.className = 'plan-badge ' + plan;
    } catch(e) {}

    // Load saved settings
    document.getElementById('agency-name').value = localStorage.getItem('wl_agency_name') || agencyName;
    document.getElementById('agency-tagline').value = localStorage.getItem('wl_agency_tagline') || '';
    const savedColor = localStorage.getItem('wl_brand_color') || '#FF883F';
    document.getElementById('brand-color').value = savedColor;
    document.getElementById('brand-color-hex').value = savedColor;

    // Load sites for scan selector
    await loadSites();
    updatePreview();

  } catch(e) {
    console.error('Init error:', e.message, e);
    // Only redirect if truly not authenticated
    const { data: { session: s2 } } = await sb.auth.getSession().catch(() => ({ data: { session: null } }));
    if (!s2) window.location.href = 'forge-ai-login.html';
  }
}

async function loadSites() {
  try {
    const { data: sites } = await sb.from('user_sites')
      .select('name, url, score, last_result, last_scan')
      .eq('user_id', USER.id)
      .not('score', 'is', null)
      .order('last_scan', { ascending: false });

    const select = document.getElementById('scan-select');
    select.innerHTML = '<option value="">Select a site scan...</option>';
    if (sites && sites.length > 0) {
      sites.forEach(function(site, i) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = (site.name || site.url) + ' — Score: ' + site.score;
        opt.dataset.site = JSON.stringify(site);
        select.appendChild(opt);
      });
    }
  } catch(e) {
    console.log('Load sites error:', e.message);
  }
}

function loadScan() {
  const select = document.getElementById('scan-select');
  const selected = select.options[select.selectedIndex];
  if (!selected || !selected.dataset.site) return;

  const site = JSON.parse(selected.dataset.site);
  const result = site.last_result || {};

  currentScanData = result;
  currentScanData.modules = result.modules || {};

  document.getElementById('report-url').value = site.url || '';
  document.getElementById('report-score').value = site.score || 0;
  document.getElementById('report-summary').value = result.summary || '';

  if (!document.getElementById('client-name').value) {
    document.getElementById('client-name').value = site.name || '';
  }

  updatePreview();
}

function syncColorFromPicker() {
  const color = document.getElementById('brand-color').value;
  document.getElementById('brand-color-hex').value = color;
  localStorage.setItem('wl_brand_color', color);
  updatePreview();
}

function syncColorFromHex() {
  const hex = document.getElementById('brand-color-hex').value.trim();
  if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
    document.getElementById('brand-color').value = hex;
    localStorage.setItem('wl_brand_color', hex);
  }
  updatePreview();
}

function updatePreview() {
  // Save settings
  localStorage.setItem('wl_agency_name', document.getElementById('agency-name').value);
  localStorage.setItem('wl_agency_tagline', document.getElementById('agency-tagline').value);

  const html = generateReportHTML();
  document.getElementById('report-preview').innerHTML = html;
}

function generateReportHTML() {
  const agencyName = document.getElementById('agency-name').value || 'Your Agency';
  const agencyTagline = document.getElementById('agency-tagline').value || '';
  const brandColor = document.getElementById('brand-color').value || '#FF883F';
  const clientName = document.getElementById('client-name').value || 'Client';
  const reportUrl = document.getElementById('report-url').value || 'https://clientsite.com';
  const score = parseInt(document.getElementById('report-score').value) || 0;
  const summary = document.getElementById('report-summary').value || 'This report provides a comprehensive analysis of your website performance across SEO, speed, mobile experience, user experience, and maintenance.';
  const date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

  const scoreColor = score >= 80 ? '#16a34a' : score >= 60 ? '#d97706' : '#dc2626';
  const grade = score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : score >= 60 ? 'D' : 'F';
  const scoreLabel = score >= 90 ? 'Excellent' : score >= 80 ? 'Strong' : score >= 70 ? 'Good' : score >= 60 ? 'Fair' : 'Needs Work';

  const mods = currentScanData?.modules || {};

  function getModScore(key) {
    const m = mods[key] || (key === 'performance' ? mods['speed'] : null);
    return m?.score !== undefined ? m.score : Math.round(score * 0.2);
  }

  function modBar(score, max, color) {
    const pct = Math.round((score / max) * 100);
    return `
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${color};border-radius:3px"></div>
        </div>
        <div style="font-size:13px;font-weight:700;color:${color};width:36px;text-align:right;font-family:monospace">${score}/20</div>
      </div>`;
  }

  const modules = [
    { key: 'seo', name: 'SEO & Discoverability' },
    { key: 'performance', name: 'Performance & Speed' },
    { key: 'mobile', name: 'Mobile Experience' },
    { key: 'ux', name: 'UX & Conversion' },
    { key: 'maintenance', name: 'Maintenance & Security' },
  ];

  const modulesHtml = modules.map(function(m) {
    const s = getModScore(m.key);
    const c = s >= 17 ? '#16a34a' : s >= 13 ? '#d97706' : '#dc2626';
    const mod = mods[m.key] || (m.key === 'performance' ? mods['speed'] : null) || {};
    const issues = mod.deductions || mod.issues || [];
    const patches = mod.patches || [];

    const issuesHtml = issues.slice(0, 3).map(function(issue, i) {
      const text = typeof issue === 'string' ? issue : (issue.issue || '');
      const fix = patches[i] || '';
      return `
        <div style="padding:8px 0;border-bottom:1px solid #f3f4f6">
          <div style="font-size:12px;color:#374151;margin-bottom:${fix ? '4px' : '0'}">${text}</div>
          ${fix ? `<div style="font-size:11px;color:#6b7280;padding-left:10px;border-left:2px solid ${brandColor}">→ ${fix}</div>` : ''}
        </div>`;
    }).join('');

    return `
      <div style="margin-bottom:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <div style="font-size:13px;font-weight:700;color:#111827">${m.name}</div>
        </div>
        ${modBar(s, 20, c)}
        ${issuesHtml ? `<div style="margin-top:10px">${issuesHtml}</div>` : ''}
      </div>`;
  }).join('');

  // Priority fixes
  const allPatches = Object.values(mods).flatMap(function(m) { return (m && m.patches) ? m.patches : []; }).slice(0, 5);
  const fixesHtml = allPatches.length > 0
    ? allPatches.map(function(fix, i) {
        return `<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6">
          <div style="width:22px;height:22px;background:${brandColor};color:#fff;border-radius:5px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</div>
          <div style="font-size:12px;color:#374151;line-height:1.5">${fix}</div>
        </div>`;
      }).join('')
    : '<div style="font-size:12px;color:#6b7280;padding:8px 0">No specific fixes identified — site is performing well.</div>';

  return `
  <div style="font-family:'Helvetica Neue',Arial,sans-serif;color:#111827;background:#fff;min-height:100%">

    <!-- DARK HEADER with brand -->
    <div style="background:#111827;padding:28px 40px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:20px;font-weight:800;color:${brandColor};letter-spacing:-0.02em">${agencyName}</div>
        ${agencyTagline ? `<div style="font-size:11px;color:#9ca3af;margin-top:2px">${agencyTagline}</div>` : ''}
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:#9ca3af;margin-bottom:2px">Website Performance Report</div>
        <div style="font-size:12px;font-weight:600;color:#fff">${clientName}</div>
        <div style="font-size:11px;color:#6b7280;margin-top:1px">${date}</div>
      </div>
    </div>

    <!-- URL BAR -->
    <div style="background:#f9fafb;border-bottom:1px solid #e5e7eb;padding:10px 40px;font-size:12px;color:#6b7280;font-family:monospace">
      ${reportUrl}
    </div>

    <div style="padding:36px 40px">

      <!-- SCORE HERO -->
      <div style="display:flex;align-items:center;gap:32px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px;padding:28px;margin-bottom:32px">
        <div style="text-align:center;flex-shrink:0">
          <div style="font-size:72px;font-weight:800;color:${scoreColor};line-height:1;letter-spacing:-0.04em">${score}</div>
          <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:0.08em;margin-top:2px">out of 100</div>
          <div style="display:inline-block;margin-top:8px;padding:3px 12px;background:${scoreColor};color:#fff;border-radius:20px;font-size:12px;font-weight:700">Grade ${grade}</div>
        </div>
        <div style="flex:1">
          <div style="font-size:20px;font-weight:800;color:#111827;letter-spacing:-0.03em;margin-bottom:4px">${scoreLabel} Performance</div>
          <div style="font-size:13px;color:#6b7280;line-height:1.7">${summary}</div>
        </div>
      </div>

      <!-- MODULE BREAKDOWN -->
      <div style="margin-bottom:32px">
        <div style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid ${brandColor}">
          Module Breakdown
        </div>
        ${modulesHtml}
      </div>

      <!-- PRIORITY FIXES -->
      <div style="margin-bottom:32px">
        <div style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid ${brandColor}">
          Priority Fixes
        </div>
        ${fixesHtml}
      </div>

      <!-- FOOTER -->
      <div style="padding-top:24px;border-top:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:11px;color:#9ca3af">Prepared by ${agencyName} · ${date}</div>
        <div style="font-size:10px;color:#d1d5db">Powered by Forge AI</div>
      </div>

    </div>
  </div>`;
}

function downloadReport() {
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Website Report — ${document.getElementById('client-name').value || 'Client'}</title><style>*{box-sizing:border-box;margin:0;padding:0}body{margin:0;padding:0}@media print{body{margin:0}}</style></head><body>${generateReportHTML()}


</body></html>`;
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const clientName = document.getElementById('client-name').value || 'client';
  a.download = `report-${clientName.toLowerCase().replace(/\s/g,'-')}-${new Date().toISOString().split('T')[0]}.html`;
  a.click();

  // Open print dialog for PDF
  setTimeout(function() {
    const win = window.open('', '_blank');
    win.document.write(html);
    win.document.close();
    win.onload = function() { win.print(); };
  }, 500);
}


init();

// ── SHARED ROLE & PLAN CHECK ─────────────────────────────


async function applyNavRole(sb, userId, userEmail) {
  try {
    var hide = function(id) { var el=document.getElementById(id); if(el) el.style.display='none'; };
    var show = function(id) { var el=document.getElementById(id); if(el) el.style.display='flex'; };
    var res = await sb.from('team_members').select('role,agency_id').eq('user_id',userId).eq('status','active').maybeSingle();
    var member = res.data;
    if (member) {
      hide('team-nav'); hide('billing-nav'); hide('settings-nav'); hide('connections-nav');
      if (member.role !== 'developer') show('connections-nav');
      var pb = document.getElementById('sb-plan-badge');
      if (pb) { pb.textContent = member.role.charAt(0).toUpperCase()+member.role.slice(1); pb.style.background='rgba(34,201,122,0.1)'; pb.style.color='#22c97a'; }
      var an = document.getElementById('sb-agency-name');
      if (an) an.textContent = 'Team Member';
      var banner = document.getElementById('plan-banner');
      if (banner) banner.style.display = 'none';
      return { isTeamMember: true, role: member.role };
    } else {
      show('team-nav');
      var subRes = await sb.from('subscriptions').select('plan,sites_limit').eq('email',userEmail).maybeSingle();
      var sub = subRes.data;
      var plan = (sub && sub.plan) ? sub.plan : 'free';
      var planNames = { free:'Free', starter:'Starter', agency:'Agency', enterprise:'Enterprise' };
      var pb2 = document.getElementById('sb-plan-badge');
      var planColors = { free:{bg:'rgba(107,107,120,0.15)',color:'#70708a'}, starter:{bg:'rgba(77,159,255,0.12)',color:'#4d9fff'}, agency:{bg:'rgba(34,201,122,0.12)',color:'#22c97a'}, enterprise:{bg:'rgba(255,136,63,0.12)',color:'#FF883F'} };
      if (pb2) { pb2.textContent=planNames[plan]||'Free'; var c=planColors[plan]||planColors.free; pb2.style.background=c.bg; pb2.style.color=c.color; }
      var an2 = document.getElementById('sb-agency-name');
      if (an2) an2.textContent = userEmail.split('@')[0];
      if (plan === 'free') { hide('connections-nav'); hide('team-nav'); hide('alerts-nav'); }
      else { show('connections-nav'); show('team-nav'); show('alerts-nav'); }
      return { isTeamMember: false, role: 'owner', plan: plan };
    }
  } catch(e) { console.log('Nav role error:', e.message); return { isTeamMember: false, role: 'owner' }; }
}

  await sb.auth.signOut();
  window.location.href = 'forge-ai-login.html';
}
