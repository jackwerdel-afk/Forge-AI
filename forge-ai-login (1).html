<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge AI — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg: #09090f; --surface: #111117; --surface2: #17171f;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #f0f0f5; --text2: #a0a0b0; --muted: #606070;
  --muted2: #9090a8;
  --accent: #FF883F; --accent2: #ff6b20;
  --green: #22c97a; --red: #ff4d4d;
  --yellow: #f5a623;
  --blue: #4d9fff;
  --font: 'Inter', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; -webkit-font-smoothing: antialiased; }

.container { width: 100%; max-width: 420px; }

.logo { display: flex; align-items: center; justify-content: center; margin-bottom: 36px; }
.logo img { height: 52px; width: auto; object-fit: contain; mix-blend-mode: screen; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px; }

.card-title { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; text-align: center; }
.card-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 28px; }

.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; }
.form-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.form-input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 9px; padding: 11px 14px; color: var(--text); font-family: var(--font); font-size: 13.5px; outline: none; transition: border-color 0.15s; }
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--muted); }

.forgot-link { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 500; }
.forgot-link:hover { text-decoration: underline; }

.btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 9px; padding: 12px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary:hover { background: var(--accent2); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-google { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 9px; padding: 11px; font-family: var(--font); font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: not-allowed; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; opacity: 0.5; }

.divider { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.divider-line { flex: 1; height: 1px; background: var(--border); }
.divider-text { font-size: 12px; color: var(--muted); white-space: nowrap; }

.error-msg { background: rgba(255,77,77,.08); border: 1px solid rgba(255,77,77,.2); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; color: var(--red); margin-bottom: 14px; display: none; line-height: 1.5; }
.info-msg { background: rgba(255,136,63,.08); border: 1px solid rgba(255,136,63,.2); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; color: var(--accent); margin-bottom: 14px; display: none; line-height: 1.5; }

.link-row { text-align: center; font-size: 13px; color: var(--muted); margin-top: 20px; }
.link-row a { color: var(--accent); text-decoration: none; font-weight: 500; }
.link-row a:hover { text-decoration: underline; }

@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
</style>
</head>
<body>

<div class="container">

  <div class="logo">
    <img src="Powered by Werdel Global Systems.png" alt="Forge AI">
  </div>

  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your Forge AI account</div>

    <!-- Google (coming soon) -->
    <button class="btn-google" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google — Coming Soon
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or continue with email</div>
      <div class="divider-line"></div>
    </div>

    <div id="error-msg" class="error-msg"></div>
    <div id="info-msg" class="info-msg"></div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@agency.com" onkeydown="if(event.key==='Enter')handleLogin()">
    </div>

    <div class="form-group">
      <div class="form-label-row">
        <label class="form-label" style="margin-bottom:0">Password</label>
        <a href="forge-ai-forgot-password.html" class="forgot-link">Forgot password?</a>
      </div>
      <input type="password" id="password" class="form-input" placeholder="Your password" onkeydown="if(event.key==='Enter')handleLogin()">
    </div>

    <button class="btn-primary" id="login-btn" onclick="handleLogin()">
      Sign In →
    </button>
  </div>

  <div class="link-row">
    Don't have an account? <a href="forge-ai-signup.html">Create account</a>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://mybvzjcjfjytcfgitmpv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15YnZ6amNqZmp5dGNmZ2l0bXB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTE5MjgsImV4cCI6MjA5NDE4NzkyOH0.OHKGmKlyk86kdSXjFh5jVHqvMC-nPKhPkAtSraPVwEs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.innerHTML = msg;
  el.style.display = 'block';
  document.getElementById('info-msg').style.display = 'none';
}

function showInfo(msg) {
  const el = document.getElementById('info-msg');
  el.innerHTML = msg;
  el.style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
}

function hideMessages() {
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('info-msg').style.display = 'none';
}

async function handleLogin() {
  hideMessages();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email) { showError('Please enter your email address.'); return; }
  if (!password) { showError('Please enter your password.'); return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Signing in...';

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      btn.innerHTML = 'Sign In →';

      if (error.message.includes('Email not confirmed') || error.message.includes('email_not_confirmed')) {
        showError('Please confirm your email first. Check your inbox for the confirmation link from Forge AI.<br><br><a href="forge-ai-signup.html" style="color:var(--accent)">Resend confirmation email →</a>');
      } else if (error.message.includes('Invalid login credentials')) {
        showError('Incorrect email or password. Please try again.');
      } else {
        showError(error.message || 'Something went wrong. Please try again.');
      }
      return;
    }

    // Success - create token if first login
    if (data.user) {
      try {
        const { data: existing } = await sb.from('agency_tokens').select('token').eq('user_id', data.user.id).maybeSingle();
        if (!existing) {
          const token = 'fat_' + data.user.id.replace(/-/g,'').slice(0,16) + '_forgeai';
          await sb.from('agency_tokens').insert({ user_id: data.user.id, token: token });
        }
      } catch(e) { console.log('Token error:', e.message); }
    }

    showInfo('✓ Signed in! Loading your dashboard...');
    setTimeout(function() { window.location.href = 'forge-ai-dashboard.html'; }, 800);

  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = 'Sign In →';
    showError(e.message || 'Something went wrong. Please try again.');
  }
}
</script>
</body>
</html>
