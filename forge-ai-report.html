<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge AI — White Label Report</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--surface:#131315;--surface2:#1a1a1d;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--text:#f0f0f2;--muted:#6b6b78;--muted2:#9090a0;--accent:#ff6b35;--green:#22c97a;--amber:#f5a623;--red:#ff3b3b;--blue:#4d9fff;--font:'Syne',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:2rem}
.wrap{max-width:900px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.5rem}
.subtitle{font-size:.88rem;color:var(--muted2);margin-bottom:2rem;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:1.5rem;margin-bottom:1.25rem}
.card h2{font-size:1rem;font-weight:700;margin-bottom:.75rem}
.field{margin-bottom:1rem}
.field label{display:block;font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--mono);font-size:.8rem;outline:none;transition:border-color .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted)}
.field textarea{resize:vertical;min-height:80px}
.color-row{display:flex;gap:10px;align-items:center}
.color-row input[type=color]{width:48px;height:36px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;padding:2px}
.btn{padding:10px 22px;border-radius:8px;border:none;cursor:pointer;font-family:var(--font);font-size:.85rem;font-weight:700;transition:all .2s}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:#ff8c5a}
.btn-ghost{background:transparent;color:var(--muted2);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--text)}

/* REPORT PREVIEW */
.preview-wrap{background:var(--surface);border:1px solid var(--border2);border-radius:14px;overflow:hidden}
.preview-label{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:1rem 1.5rem;border-bottom:1px solid var(--border)}
#report-preview{background:#fff;min-height:600px;overflow:auto}

/* REPORT STYLES (inside iframe/preview) */
.report{font-family:'Helvetica Neue',Arial,sans-serif;color:#1a1a1a;max-width:800px;margin:0 auto;padding:48px}
.report-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:40px;padding-bottom:24px;border-bottom:2px solid #f0f0f0}
.agency-logo{font-size:24px;font-weight:800;letter-spacing:-.02em}
.report-meta{text-align:right;font-size:12px;color:#666}
.report-title{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.report-url{font-size:13px;color:#666;font-family:monospace;margin-bottom:32px}
.score-section{display:flex;align-items:center;gap:32px;background:#f8f8f8;border-radius:12px;padding:24px;margin-bottom:32px}
.big-score{font-size:64px;font-weight:800;line-height:1}
.score-details{flex:1}
.score-label{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.score-summary{font-size:14px;color:#333;line-height:1.6}
.modules-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:32px}
.mod-box{background:#f8f8f8;border-radius:8px;padding:16px;text-align:center}
.mod-name{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-bottom:8px}
.mod-score{font-size:24px;font-weight:800}
.mod-max{font-size:11px;color:#999}
.section-title{font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #eee}
.issue-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.issue-sev{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap;margin-top:2px}
.sev-critical{background:#ffe5e5;color:#cc0000}
.sev-high{background:#fff3e0;color:#e65c00}
.sev-medium{background:#e8f0fe;color:#1a73e8}
.issue-body{}
.issue-name{font-size:13px;font-weight:600;margin-bottom:2px}
.issue-desc{font-size:12px;color:#666;line-height:1.5}
.patch-box{background:#f8fff8;border:1px solid #d4edda;border-radius:8px;padding:16px;margin-bottom:12px}
.patch-field{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-bottom:8px;font-weight:600}
.patch-current{font-size:12px;color:#999;font-family:monospace;background:#f0f0f0;padding:6px 10px;border-radius:4px;margin-bottom:6px}
.patch-suggested{font-size:12px;color:#1a7f4b;font-family:monospace;background:#e8f5e9;padding:6px 10px;border-radius:4px}
.report-footer{margin-top:48px;padding-top:24px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#999}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">F</div>
    <span style="font-size:1.1rem;font-weight:800">Forge AI — White Label Reports</span>
  </div>

  <h1>Create a branded client report</h1>
  <p class="subtitle">Customize the report with your agency branding. Your client will see your logo and colors — not Forge AI's.</p>

  <div class="grid">
    <!-- LEFT: SETTINGS -->
    <div>
      <div class="card">
        <h2>Agency branding</h2>
        <div class="field">
          <label>Agency Name</label>
          <input type="text" id="agency-name" placeholder="Your Agency Name" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Tagline (optional)</label>
          <input type="text" id="agency-tagline" placeholder="Web Design & Digital Marketing" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Brand Color</label>
          <div class="color-row">
            <input type="color" id="brand-color" value="#ff6b35" oninput="updatePreview()">
            <input type="text" id="brand-color-hex" value="#ff6b35" placeholder="#ff6b35" oninput="syncColor()" style="flex:1">
          </div>
        </div>
        <div class="field">
          <label>Prepared for (client name)</label>
          <input type="text" id="client-name" placeholder="Client Company Name" oninput="updatePreview()">
        </div>
      </div>

      <div class="card">
        <h2>Report data</h2>
        <div class="field">
          <label>Website URL</label>
          <input type="text" id="report-url" placeholder="https://clientsite.com" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Overall Score (0-100)</label>
          <input type="number" id="report-score" min="0" max="100" value="72" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Executive Summary</label>
          <textarea id="report-summary" placeholder="Brief summary of the site's current performance and key findings..." oninput="updatePreview()"></textarea>
        </div>
        <div class="field">
          <label>Load from last scan</label>
          <select id="scan-select" onchange="loadScan()">
            <option value="">Select a recent scan...</option>
          </select>
        </div>
      </div>

      <div style="display:flex;gap:10px">
        <button class="btn btn-accent" onclick="downloadReport()">Download PDF Report</button>
        <button class="btn btn-ghost" onclick="updatePreview()">Refresh Preview</button>
      </div>
    </div>

    <!-- RIGHT: PREVIEW -->
    <div>
      <div class="preview-wrap">
        <div class="preview-label">Live Preview</div>
        <div id="report-preview"></div>
      </div>
    </div>
  </div>
</div>

<script>
// Load scan data from localStorage
const SUPA_URL = 'https://mybvzjcjfjytcfgitmpv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15YnZ6amNqZmp5dGNmZ2l0bXB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTE5MjgsImV4cCI6MjA5NDE4NzkyOH0.OHKGmKlyk86kdSXjFh5jVHqvMC-nPKhPkAtSraPVwEs';

let currentScanData = null;

window.onload = async () => {
  // Load saved agency settings
  document.getElementById('agency-name').value = localStorage.getItem('wl_agency_name') || '';
  document.getElementById('agency-tagline').value = localStorage.getItem('wl_agency_tagline') || '';
  document.getElementById('brand-color').value = localStorage.getItem('wl_brand_color') || '#ff6b35';
  document.getElementById('brand-color-hex').value = localStorage.getItem('wl_brand_color') || '#ff6b35';

  // Load sites from ALL possible user IDs in localStorage
  const select = document.getElementById('scan-select');
  const allKeys = Object.keys(localStorage).filter(k => k.startsWith('forge_sites_'));
  
  allKeys.forEach(key => {
    const sites = JSON.parse(localStorage.getItem(key) || '[]');
    sites.filter(s => s.lastResult).forEach(s => {
      const opt = document.createElement('option');
      opt.value = JSON.stringify(s.id) + '|' + key;
      opt.textContent = s.name + ' — ' + s.score + '/100';
      select.appendChild(opt);
    });
  });

  updatePreview();
};

function getUserId() {
  // Try to get user ID from supabase session
  try {
    const keys = Object.keys(localStorage).filter(k => k.includes('supabase'));
    for (const key of keys) {
      const val = JSON.parse(localStorage.getItem(key) || '{}');
      if (val?.user?.id) return val.user.id;
    }
  } catch(e) {}
  return null;
}

function loadScan() {
  const val = document.getElementById('scan-select').value;
  if (!val) return;
  
  const parts = val.split('|');
  const id = JSON.parse(parts[0]);
  const key = parts[1];
  
  const sites = JSON.parse(localStorage.getItem(key) || '[]');
  const site = sites.find(s => s.id === id);
  if (!site || !site.lastResult) return;
  
  currentScanData = site;
  document.getElementById('report-url').value = site.url;
  document.getElementById('report-score').value = site.score;
  document.getElementById('report-summary').value = site.summary || site.lastResult?.summary || '';
  document.getElementById('client-name').value = site.name || '';
  updatePreview();
}

function syncColor() {
  const hex = document.getElementById('brand-color-hex').value;
  if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
    document.getElementById('brand-color').value = hex;
    updatePreview();
  }
}

function saveSettings() {
  localStorage.setItem('wl_agency_name', document.getElementById('agency-name').value);
  localStorage.setItem('wl_agency_tagline', document.getElementById('agency-tagline').value);
  localStorage.setItem('wl_brand_color', document.getElementById('brand-color').value);
}

function updatePreview() {
  saveSettings();
  const html = generateReportHTML();
  document.getElementById('report-preview').innerHTML = html;
}

function generateReportHTML() {
  const agencyName = document.getElementById('agency-name').value || 'Your Agency';
  const agencyTagline = document.getElementById('agency-tagline').value || '';
  const brandColor = document.getElementById('brand-color').value || '#ff6b35';
  const clientName = document.getElementById('client-name').value || 'Client';
  const reportUrl = document.getElementById('report-url').value || 'https://clientsite.com';
  const score = parseInt(document.getElementById('report-score').value) || 0;
  const summary = document.getElementById('report-summary').value || 'This report provides a comprehensive analysis of your website performance across SEO, speed, mobile experience, UX, and maintenance.';
  const date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

  const scoreColor = score >= 75 ? '#22c97a' : score >= 50 ? '#f5a623' : '#ff3b3b';
  const grade = score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : score >= 60 ? 'D' : 'F';

  // Get modules from scan data
  const modules = currentScanData?.modules || {
    seo: { score: Math.round(score * 0.2) },
    speed: { score: Math.round(score * 0.19) },
    mobile: { score: Math.round(score * 0.21) },
    ux: { score: Math.round(score * 0.2) },
    maintenance: { score: Math.round(score * 0.2) }
  };

  const allIssues = currentScanData ? Object.values(currentScanData.modules || {}).flatMap(m => m.issues || []) : [];
  const patches = currentScanData?.patches || [];

  return `
  <div class="report" style="font-family:'Helvetica Neue',Arial,sans-serif;color:#1a1a1a;max-width:800px;margin:0 auto;padding:48px">

    <!-- HEADER -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:40px;padding-bottom:24px;border-bottom:3px solid ${brandColor}">
      <div>
        <div style="font-size:22px;font-weight:800;color:${brandColor};letter-spacing:-.02em">${agencyName}</div>
        ${agencyTagline ? `<div style="font-size:12px;color:#666;margin-top:2px">${agencyTagline}</div>` : ''}
      </div>
      <div style="text-align:right;font-size:12px;color:#666">
        <div style="font-weight:600;color:#333;margin-bottom:2px">Website Analysis Report</div>
        <div>Prepared for: ${clientName}</div>
        <div>${date}</div>
      </div>
    </div>

    <!-- TITLE -->
    <div style="font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px">Website Performance Report</div>
    <div style="font-size:13px;color:#666;font-family:monospace;margin-bottom:32px">${reportUrl}</div>

    <!-- SCORE -->
    <div style="display:flex;align-items:center;gap:32px;background:#f8f8f8;border-radius:12px;padding:24px;margin-bottom:32px">
      <div style="text-align:center">
        <div style="font-size:64px;font-weight:800;color:${scoreColor};line-height:1">${score}</div>
        <div style="font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.08em">Out of 100</div>
      </div>
      <div style="flex:1">
        <div style="font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Overall Grade: ${grade}</div>
        <div style="font-size:14px;color:#333;line-height:1.6">${summary}</div>
      </div>
    </div>

    <!-- MODULE SCORES -->
    <div style="font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #eee">Module Scores</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:32px">
      ${[
        { name: 'SEO', key: 'seo' },
        { name: 'Speed', key: 'speed' },
        { name: 'Mobile', key: 'mobile' },
        { name: 'UX', key: 'ux' },
        { name: 'Maintenance', key: 'maintenance' }
      ].map(m => {
        const s = modules[m.key]?.score || 0;
        const c = s >= 15 ? '#22c97a' : s >= 10 ? '#f5a623' : '#ff3b3b';
        return `<div style="background:#f8f8f8;border-radius:8px;padding:16px;text-align:center;border-top:3px solid ${c}">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-bottom:8px">${m.name}</div>
          <div style="font-size:24px;font-weight:800;color:${c}">${s}</div>
          <div style="font-size:11px;color:#999">/ 20</div>
        </div>`;
      }).join('')}
    </div>

    <!-- ISSUES -->
    ${allIssues.length > 0 ? `
    <div style="font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #eee">Issues Found</div>
    ${allIssues.slice(0,8).map(i => `
      <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0">
        <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap;margin-top:2px;background:${i.severity==='critical'?'#ffe5e5':i.severity==='high'?'#fff3e0':'#e8f0fe'};color:${i.severity==='critical'?'#cc0000':i.severity==='high'?'#e65c00':'#1a73e8'}">${i.severity.toUpperCase()}</span>
        <div>
          <div style="font-size:13px;font-weight:600;margin-bottom:2px">${i.name}</div>
          <div style="font-size:12px;color:#666;line-height:1.5">${i.description}</div>
        </div>
      </div>`).join('')}
    <div style="margin-bottom:32px"></div>` : ''}

    <!-- PATCHES -->
    ${patches.length > 0 ? `
    <div style="font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #eee">Recommended Improvements</div>
    ${patches.slice(0,4).map(p => `
      <div style="background:#f8fff8;border:1px solid #d4edda;border-radius:8px;padding:16px;margin-bottom:12px">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-bottom:8px;font-weight:600">${(p.field||'').replace(/_/g,' ')}</div>
        <div style="font-size:12px;color:#999;font-family:monospace;background:#f0f0f0;padding:6px 10px;border-radius:4px;margin-bottom:6px">Current: ${p.current || 'MISSING'}</div>
        <div style="font-size:12px;color:#1a7f4b;font-family:monospace;background:#e8f5e9;padding:6px 10px;border-radius:4px">Suggested: ${p.suggested}</div>
      </div>`).join('')}
    <div style="margin-bottom:32px"></div>` : ''}

    <!-- FOOTER -->
    <div style="margin-top:48px;padding-top:24px;border-top:2px solid ${brandColor};display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:13px;font-weight:700;color:${brandColor}">${agencyName}</div>
      <div style="font-size:11px;color:#999">Confidential — Prepared for ${clientName} — ${date}</div>
    </div>

  </div>`;
}

function downloadReport() {
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Website Report</title></head><body style="margin:0;padding:0">${generateReportHTML()}</body></html>`;
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const clientName = document.getElementById('client-name').value || 'client';
  a.download = `website-report-${clientName.toLowerCase().replace(/\s/g,'-')}-${new Date().toISOString().split('T')[0]}.html`;
  a.click();

  // Also trigger print dialog for PDF saving
  setTimeout(() => {
    const win = window.open('', '_blank');
    win.document.write(html);
    win.document.close();
    win.onload = () => { win.print(); };
  }, 500);
}
</script>
</body>
</html>
