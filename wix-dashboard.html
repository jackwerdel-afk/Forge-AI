<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Forge AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--surface:#111117;--surface2:#17171f;--surface3:#1e1e28;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f0f5;--text2:#a0a0b0;--muted:#70708a;--muted2:#9090a8;
  --accent:#FF883F;--green:#22c97a;--yellow:#f5a623;--red:#ff4d4d;--blue:#4d9fff;
  --font:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;padding:32px 24px 48px;max-width:900px;margin:0 auto}

/* Header */
.header{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{height:48px;display:flex;align-items:center;flex-shrink:0}
.logo-mark img{height:48px;width:auto;display:block}
.logo-text{display:none}
.header-plan{font-size:11px;font-family:var(--mono);color:var(--muted);background:var(--surface2);border:1px solid var(--border2);padding:4px 10px;border-radius:20px}

/* Score card */
.score-card{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:28px 32px;margin-bottom:20px;
  display:flex;align-items:center;gap:32px;
}
.score-ring-wrap{flex-shrink:0}
.score-ring{position:relative;width:90px;height:90px}
.score-ring svg{transform:rotate(-90deg)}
.score-ring-bg{fill:none;stroke:var(--surface3);stroke-width:8}
.score-ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 0.8s ease}
.score-number{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-val{font-size:26px;font-weight:800;letter-spacing:-0.04em;line-height:1}
.score-label{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.score-info{flex:1;min-width:0}
.score-site{font-size:12px;font-family:var(--mono);color:var(--muted);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-grade{font-size:20px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px}
.score-sub{font-size:12px;color:var(--text2);line-height:1.5}
.score-meta{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:8px}

/* Stat row */
.stat-row{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.stat-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono);margin-bottom:8px}
.stat-value{font-size:22px;font-weight:800;letter-spacing:-0.04em;line-height:1}
.stat-value.green{color:var(--green)}
.stat-value.orange{color:var(--accent)}
.stat-value.yellow{color:var(--yellow)}
.stat-sub{font-size:11px;color:var(--muted2);margin-top:4px}

/* CTA */
.cta-card{
  width:100%;background:linear-gradient(135deg,rgba(255,136,63,0.08) 0%,rgba(255,136,63,0.03) 100%);
  border:1px solid rgba(255,136,63,0.2);border-radius:14px;
  padding:24px 28px;margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.cta-text{flex:1}
.cta-title{font-size:15px;font-weight:700;margin-bottom:4px}
.cta-sub{font-size:12px;color:var(--text2);line-height:1.5}
.btn-open{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--accent);color:#fff;
  padding:11px 22px;border-radius:9px;
  font-size:13px;font-weight:700;font-family:var(--font);
  text-decoration:none;border:none;cursor:pointer;
  transition:opacity 0.15s;white-space:nowrap;flex-shrink:0;
}
.btn-open:hover{opacity:0.88}

/* Pending fixes list */
.fixes-section{width:100%}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;font-family:var(--mono)}
.fix-item{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;margin-bottom:8px;
  display:flex;align-items:center;gap:12px;
}
.fix-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.fix-type{font-size:11px;font-weight:700;color:var(--accent);font-family:var(--mono);flex-shrink:0;min-width:110px}
.fix-desc{font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fix-pts{font-size:11px;color:var(--green);font-family:var(--mono);flex-shrink:0}

/* Loading / error states */
.state-loading,.state-error,.state-nosite{
  width:100%;text-align:center;padding:60px 24px;
}
.state-icon{font-size:36px;margin-bottom:16px;opacity:0.4}
.state-title{font-size:15px;font-weight:700;margin-bottom:6px}
.state-sub{font-size:13px;color:var(--muted2);line-height:1.6}
.spinner{
  width:36px;height:36px;border:3px solid var(--border2);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.7s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Divider */
.divider{width:100%;height:1px;background:var(--border);margin:4px 0 20px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark"><img src="https://forgeai-wgs.com/Powered%20by%20Werdel%20Global%20Systems.png" alt="Forge AI"></div>
  </div>
  <div class="header-plan" id="plan-badge">Loading...</div>
</div>

<div id="app">
  <div class="state-loading">
    <div class="spinner"></div>
    <div class="state-title">Loading your SEO dashboard...</div>
  </div>
</div>

<script>
(function() {
  // ── Read Wix instance token from URL ──────────────────────
  const params = new URLSearchParams(window.location.search);
  const instance = params.get('instance');

  if (!instance) {
    showError('No instance token found. Please re-open this page from your Wix dashboard.');
    return;
  }

  // ── Fetch dashboard data from our backend ─────────────────
  fetch('/api/wix-dashboard-data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ instance: instance })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (!data.success) {
      if (data.noSite) {
        showNoSite();
      } else {
        showError(data.error || 'Could not load dashboard data.');
      }
      return;
    }
    renderDashboard(data);
  })
  .catch(function(e) {
    showError('Connection error. Please try again.');
  });

  // ── Render ────────────────────────────────────────────────
  function renderDashboard(d) {
    var score = d.score || 0;
    var siteUrl = d.siteUrl || '';
    var siteName = d.siteName || siteUrl;
    var pendingFixes = d.pendingFixes || [];
    var pendingCount = d.pendingCount || 0;
    var deployedCount = d.deployedCount || 0;
    var lastScan = d.lastScan ? new Date(d.lastScan).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Never';
    var plan = d.plan || 'Free';
    var forgeUrl = 'https://forgeai-wgs.com/forge-ai-dashboard.html';

    document.getElementById('plan-badge').textContent = plan.charAt(0).toUpperCase() + plan.slice(1) + ' Plan';

    var grade = score >= 90 ? 'Excellent' : score >= 75 ? 'Good' : score >= 55 ? 'Needs Work' : 'Poor';
    var gradeColor = score >= 90 ? '#22c97a' : score >= 75 ? '#4d9fff' : score >= 55 ? '#f5a623' : '#ff4d4d';
    var ringColor = gradeColor;

    // Ring math: circumference of r=37 circle
    var r = 37;
    var circ = 2 * Math.PI * r;
    var offset = circ - (score / 100) * circ;

    var fixesHtml = '';
    if (pendingFixes.length > 0) {
      var typeLabels = {
        meta_description: 'Meta Description',
        missing_h1: 'H1 Heading',
        og_image: 'OG Image',
        structured_data: 'Structured Data',
        page_title: 'Page Title',
        alt_text: 'Alt Text'
      };
      pendingFixes.slice(0, 4).forEach(function(fix) {
        var label = typeLabels[fix.issue_type] || fix.issue_type;
        fixesHtml += '<div class="fix-item">' +
          '<div class="fix-dot"></div>' +
          '<div class="fix-type">' + escHtml(label) + '</div>' +
          '<div class="fix-desc">' + escHtml(fix.issue_description || '') + '</div>' +
          '<div class="fix-pts">+' + (fix.points_impact || 0) + ' pts</div>' +
          '</div>';
      });
      if (pendingCount > 4) {
        fixesHtml += '<div style="font-size:12px;color:var(--muted);text-align:center;padding:8px 0">+ ' + (pendingCount - 4) + ' more in Forge Agent</div>';
      }
    } else {
      fixesHtml = '<div style="font-size:13px;color:var(--muted);padding:16px 0;text-align:center">No pending fixes — great work! ✓</div>';
    }

    var ctaTitle = pendingCount > 0
      ? pendingCount + ' fix' + (pendingCount === 1 ? '' : 'es') + ' ready to approve and deploy'
      : 'Your SEO is looking good';
    var ctaSub = pendingCount > 0
      ? 'Open Forge Agent to review, edit, and deploy your AI-generated SEO fixes.'
      : 'Run a new scan anytime to check for new SEO opportunities.';

    document.getElementById('app').innerHTML =
      '<div class="score-card">' +
        '<div class="score-ring-wrap">' +
          '<div class="score-ring">' +
            '<svg width="90" height="90" viewBox="0 0 90 90">' +
              '<circle class="score-ring-bg" cx="45" cy="45" r="' + r + '"/>' +
              '<circle class="score-ring-fill" cx="45" cy="45" r="' + r + '" ' +
                'stroke="' + ringColor + '" ' +
                'stroke-dasharray="' + circ.toFixed(2) + '" ' +
                'stroke-dashoffset="' + offset.toFixed(2) + '"/>' +
            '</svg>' +
            '<div class="score-number">' +
              '<div class="score-val" style="color:' + gradeColor + '">' + score + '</div>' +
              '<div class="score-label">/ 100</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="score-info">' +
          '<div class="score-site">' + escHtml(siteName) + '</div>' +
          '<div class="score-grade" style="color:' + gradeColor + '">' + grade + '</div>' +
          '<div class="score-sub">SEO health score for your Wix site</div>' +
          '<div class="score-meta">Last scanned: ' + lastScan + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="stat-row">' +
        '<div class="stat-card">' +
          '<div class="stat-label">Pending Fixes</div>' +
          '<div class="stat-value ' + (pendingCount > 0 ? 'orange' : 'green') + '">' + pendingCount + '</div>' +
          '<div class="stat-sub">awaiting approval</div>' +
        '</div>' +
        '<div class="stat-card">' +
          '<div class="stat-label">Deployed</div>' +
          '<div class="stat-value green">' + deployedCount + '</div>' +
          '<div class="stat-sub">fixes live on your site</div>' +
        '</div>' +
        '<div class="stat-card">' +
          '<div class="stat-label">SEO Score</div>' +
          '<div class="stat-value" style="color:' + gradeColor + '">' + score + '</div>' +
          '<div class="stat-sub">out of 100</div>' +
        '</div>' +
      '</div>' +

      '<div class="cta-card">' +
        '<div class="cta-text">' +
          '<div class="cta-title">' + escHtml(ctaTitle) + '</div>' +
          '<div class="cta-sub">' + escHtml(ctaSub) + '</div>' +
        '</div>' +
        '<a class="btn-open" href="' + forgeUrl + '" target="_blank" rel="noopener">Open Forge AI &#x2197;</a>' +
      '</div>' +

      (pendingCount > 0 ?
        '<div class="fixes-section">' +
          '<div class="section-header">' +
            '<div class="section-title">Pending Fixes</div>' +
          '</div>' +
          fixesHtml +
        '</div>'
      : '');
  }

  function showNoSite() {
    document.getElementById('plan-badge').textContent = '';
    document.getElementById('app').innerHTML =
      '<div class="state-nosite">' +
        '<div class="state-icon">🔗</div>' +
        '<div class="state-title">Site not connected</div>' +
        '<div class="state-sub">Your Wix site isn\'t linked to a Forge AI account yet.<br>Sign in at Forge AI to complete setup.</div>' +
        '<br><a class="btn-open" href="https://forgeai-wgs.com/forge-ai-dashboard.html" target="_blank" rel="noopener" style="display:inline-flex;margin-top:8px">Go to Forge AI &#x2197;</a>' +
      '</div>';
  }

  function showError(msg) {
    document.getElementById('plan-badge').textContent = '';
    document.getElementById('app').innerHTML =
      '<div class="state-error">' +
        '<div class="state-icon">⚠️</div>' +
        '<div class="state-title">Something went wrong</div>' +
        '<div class="state-sub">' + escHtml(msg) + '</div>' +
      '</div>';
  }

  function escHtml(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
